# M7j: btt_reward_v3 integration pilot (NOT a learning test), seed 0.
# Registration: docs/rl_reward_v3_m7j.md and docs/rl_reward_v3_m7j.json (Stage 0).
#
# Body = rl/configs/m7g/m7g_s0_v1.toml (Phase K v1 control: obs v1, Track 1, N=5 standby, M7e PPO, horizon 3,600,
# tick-0 starts, seed 0) verbatim, except these deliberate fields:
#   [run]        name, notes, output_root = "runs/m7j", total_transitions = 102,400 (20 rollouts, one checkpoint interval)
#   [contracts]  reward = "btt_reward_v3" (its four base values equal v2's; its route constants are frozen in
#                rl/btt_rewards.py and fingerprinted; it adds SSB64_RL_TARGET_DIAG=1 to the derived native flags)
#
# Registered expectation (docs/rl_reward_v3_m7j.md, Stage 0): no episode of these 102,400 transitions can complete the
# right sweep (the historical run with the same seed broke at most 6 targets per episode), so every v3 step reward equals
# its v2 reward and the final set must equal runs/m7g_k/m7g_s0_v1/checkpoints/ckpt_000102400 exactly (policy parameter
# and obs_rms digests; the same rows on the registered row keys).
#
#   python rl/train_m7.py --config rl/configs/m7j/m7j_v3_pilot_s0.toml --dry-run

schema = "battleship_experiment_v1"

[run]
name = "m7j_v3_pilot_s0"
mode = "train"
base_seed = 0
total_transitions = 102400
output_root = "runs/m7j"
notes = "M7j Stage 0: btt_reward_v3 integration pilot, seed 0, 102,400 transitions; must reproduce Phase K m7g_s0_v1 ckpt_000102400 exactly (no sweep can occur); not a learning test"

[task]
id = "ssb64_us_mario_btt_v1"
game_version = "us"
character = "mario"
stage = "btt_mario"
player = 0
costume = 0

[contracts]
protocol_version = 1
observation = "btt_policy_obs_v1"
action = "btt_s9_b8_v1"
reward = "btt_reward_v3"
artifact_schema = 1

[reward]
# btt_reward_v3 is frozen: these four base values are enforced (equal to v2's); the route constants are not configurable.
target_broken = 1.0
per_step = -0.001
clear_bonus = 10.0
failure_penalty = -5.0

[environment]
executable = "build-us/Release/BattleShip.exe"
horizon = 3600
process_count = 5
no_render = true
raphnet_disable = true
startup_attempts = 3
startup_timeout_s = 20.0
ready_timeout_s = 60.0
request_timeout_s = 10.0
exit_timeout_s = 30.0
step_timeout_s = 900.0
worker_runtime_root = ""
port_block_base = 30000
port_block_size = 250
position_delta_threshold = 300.0
standby_preboot = true
standby_count = 1
standby_wait_timeout_s = 120.0

[ppo]
policy = "MlpPolicy"
net_arch = [64, 64]
activation = "tanh"
learning_rate = 3e-4
rollout_size = 5120
n_steps = 1024
batch_size = 512
n_epochs = 10
gamma = 0.999
gae_lambda = 0.995
clip_range = 0.2
ent_coef = 0.0
vf_coef = 0.5
max_grad_norm = 0.5
torch_threads = 1
device = "cpu"

[ppo.vecnormalize]
normalize_observations = true
normalize_rewards = false
clip_obs = 10.0

[checkpoint]
interval = 102400
initial = true

[evaluation]
interval = 0
initial = false
final = false
deterministic_episodes = 5
stochastic_episodes = 60
random_baseline_episodes = 100
seed = 12345
workers = 0

[artifacts]
periodic_episodes = 10
retain_failed_cap = 20

[resume]
source_checkpoint = ""
allow_executable_change = false
allow_lifecycle_change = false
