# M7h engineering-check smoke (E4 accounting and contract, E2/E3/E6 sources), docs/rl_frontier_curriculum_m7h_proposal.md section 5.1. Curriculum ON with
# the registered settings; seed 0; checkpoint.interval 51,200 and artifacts.periodic_episodes 1 (every finished
# training episode preserved, for the checks). Body otherwise = rl/configs/m7g/m7g_s0_v1.toml. Never a campaign run.

schema = "battleship_experiment_v1"

[run]
name = "m7h_e4_on_s0"
mode = "pilot"
base_seed = 0
total_transitions = 102400
output_root = "runs/m7h/_gate/e4"
notes = "M7h E4 accounting and contract, E2/E3/E6 sources"

[task]
id = "ssb64_us_mario_btt_v1"
game_version = "us"
character = "mario"
stage = "btt_mario"
player = 0
costume = 0

[contracts]
protocol_version = 1
observation = "btt_policy_obs_v1"
action = "btt_s9_b8_v1"
reward = "btt_reward_v2"
artifact_schema = 1

[reward]
# btt_reward_v2 is frozen: these values are enforced, not configurable (v1 plus a one-time -5.0 native-failure penalty).
target_broken = 1.0
per_step = -0.001
clear_bonus = 10.0
failure_penalty = -5.0

[environment]
executable = "build-us/Release/BattleShip.exe"
horizon = 3600
process_count = 5
no_render = true
raphnet_disable = true
startup_attempts = 3
startup_timeout_s = 20.0
ready_timeout_s = 60.0
request_timeout_s = 10.0
exit_timeout_s = 30.0
step_timeout_s = 900.0
worker_runtime_root = ""
port_block_base = 30000
port_block_size = 250
position_delta_threshold = 300.0
standby_preboot = true
standby_count = 1
standby_wait_timeout_s = 120.0

[ppo]
policy = "MlpPolicy"
net_arch = [64, 64]
activation = "tanh"
learning_rate = 3e-4
rollout_size = 5120
n_steps = 1024
batch_size = 512
n_epochs = 10
gamma = 0.999
gae_lambda = 0.995
clip_range = 0.2
ent_coef = 0.0
vf_coef = 0.5
max_grad_norm = 0.5
torch_threads = 1
device = "cpu"

[ppo.vecnormalize]
normalize_observations = true
normalize_rewards = false
clip_obs = 10.0

[checkpoint]
interval = 51200
initial = true

[evaluation]
# Phase K: no in-process evaluation during training (see the header); evaluations run post hoc.
interval = 0
initial = false
final = false
deterministic_episodes = 5
stochastic_episodes = 60
random_baseline_episodes = 100
seed = 12345
workers = 0

[artifacts]
periodic_episodes = 1
retain_failed_cap = 20

[resume]
source_checkpoint = ""
allow_executable_change = false
allow_lifecycle_change = false

[curriculum]
# M7h registered settings (user approval 2026-09-24); all keys required, values pinned by the schema.
contract = "btt_curriculum_frontier_v1"
tick0_probability = 0.5
max_prefix_ticks = 3000
pre_fall_exclusion_ticks = 60
cell_size = 300
