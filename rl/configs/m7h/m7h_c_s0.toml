# M7h frontier-restart curriculum campaign: arm C RETRAINED (used only if the R1-R3 control check fails and the user records the retrain decision; otherwise arm C is the historical runs/m7g_k/m7g_s0_v1), seed 0.
# Design, contract and decision rule: docs/rl_frontier_curriculum_m7h_proposal.md (revision 2); registered
# settings and rule: docs/rl_frontier_curriculum_m7h_manifest.json, docs/rl_frontier_curriculum_m7h_decision_rule.json.
#
# Body = rl/configs/m7g/m7g_s0_v1.toml (the Phase K v1 control, identical to M7e's semantics) verbatim, except
#   [run] name, notes, output_root = "runs/m7h/campaign" (a new tree; no historical directory is reused)
#   (no [curriculum] table: the curriculum-off control path proven by R1-R3)
#
#   python rl/m7h_campaign.py train --dry-run      (never train this profile directly)

schema = "battleship_experiment_v1"

[run]
name = "m7h_c_s0"
mode = "train"
base_seed = 0
total_transitions = 3072000
output_root = "runs/m7h/campaign"
notes = "M7h arm C RETRAINED (used only if the R1-R3 control check fails and the user records the retrain decision; otherwise arm C is the historical runs/m7g_k/m7g_s0_v1): btt_policy_obs_v1, btt_reward_v2, seed 0, N=5 standby, 3,072,000 policy transitions (hard maximum; prefix ticks are not budgeted), no in-process evaluation (post-hoc tick-0 protocol, docs/rl_frontier_curriculum_m7h_proposal.md section 6)"

[task]
id = "ssb64_us_mario_btt_v1"
game_version = "us"
character = "mario"
stage = "btt_mario"
player = 0
costume = 0

[contracts]
protocol_version = 1
observation = "btt_policy_obs_v1"
action = "btt_s9_b8_v1"
reward = "btt_reward_v2"
artifact_schema = 1

[reward]
# btt_reward_v2 is frozen: these values are enforced, not configurable (v1 plus a one-time -5.0 native-failure penalty).
target_broken = 1.0
per_step = -0.001
clear_bonus = 10.0
failure_penalty = -5.0

[environment]
executable = "build-us/Release/BattleShip.exe"
horizon = 3600
process_count = 5
no_render = true
raphnet_disable = true
startup_attempts = 3
startup_timeout_s = 20.0
ready_timeout_s = 60.0
request_timeout_s = 10.0
exit_timeout_s = 30.0
step_timeout_s = 900.0
worker_runtime_root = ""
port_block_base = 30000
port_block_size = 250
position_delta_threshold = 300.0
standby_preboot = true
standby_count = 1
standby_wait_timeout_s = 120.0

[ppo]
policy = "MlpPolicy"
net_arch = [64, 64]
activation = "tanh"
learning_rate = 3e-4
rollout_size = 5120
n_steps = 1024
batch_size = 512
n_epochs = 10
gamma = 0.999
gae_lambda = 0.995
clip_range = 0.2
ent_coef = 0.0
vf_coef = 0.5
max_grad_norm = 0.5
torch_threads = 1
device = "cpu"

[ppo.vecnormalize]
normalize_observations = true
normalize_rewards = false
clip_obs = 10.0

[checkpoint]
interval = 102400
initial = true

[evaluation]
# Phase K: no in-process evaluation during training (see the header); evaluations run post hoc.
interval = 0
initial = false
final = false
deterministic_episodes = 5
stochastic_episodes = 60
random_baseline_episodes = 100
seed = 12345
workers = 0

[artifacts]
periodic_episodes = 10
retain_failed_cap = 20

[resume]
source_checkpoint = ""
allow_executable_change = false
allow_lifecycle_change = false
