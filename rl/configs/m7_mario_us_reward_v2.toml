# btt_reward_v2 profile: identical to m7_mario_us_reward_v1.toml except for the reward contract.
#
# btt_reward_v2 = btt_reward_v1 plus a one-time -5.0 penalty on termination_reason == "native_failure"
# (the M7 fall termination). Nothing else changes: same task, contracts, environment, PPO, VecNormalize,
# cadence and evaluation protocol. The 447-step TAS clear still returns 19.553; the known 432-step fall
# returns -5.432 (v1: -0.432); a horizon truncation receives no terminal term.
#
#   python rl/train_m7.py --config rl/configs/m7_mario_us_reward_v2.toml --dry-run
#
# This profile declares the full pilot budget for a future controlled comparison; M7b only ran a bounded
# integration smoke with it (docs/rl_experiment_configuration_m7b.md).

schema = "battleship_experiment_v1"

[run]
name = "m7_mario_us_reward_v2"
mode = "pilot"
base_seed = 0
total_transitions = 1024000
output_root = "runs"
notes = "M7a pilot settings with btt_reward_v2 (one-time -5.0 native-failure penalty)"

[task]
id = "ssb64_us_mario_btt_v1"
game_version = "us"
character = "mario"
stage = "btt_mario"
player = 0
costume = 0

[contracts]
protocol_version = 1
observation = "btt_policy_obs_v1"
action = "btt_s9_b8_v1"
reward = "btt_reward_v2"
artifact_schema = 1

[reward]
# btt_reward_v2 is frozen: these values are enforced, not configurable.
target_broken = 1.0
per_step = -0.001
clear_bonus = 10.0
failure_penalty = -5.0

[environment]
executable = "build-us/Release/BattleShip.exe"
horizon = 3600
process_count = 5
no_render = true
raphnet_disable = true
startup_attempts = 3
startup_timeout_s = 20.0
ready_timeout_s = 60.0
request_timeout_s = 10.0
exit_timeout_s = 30.0
step_timeout_s = 900.0
worker_runtime_root = ""
port_block_base = 30000
port_block_size = 250
position_delta_threshold = 300.0

[ppo]
policy = "MlpPolicy"
net_arch = [64, 64]
activation = "tanh"
learning_rate = 3e-4
rollout_size = 5120
n_steps = 1024
batch_size = 512
n_epochs = 10
gamma = 0.999
gae_lambda = 0.995
clip_range = 0.2
ent_coef = 0.0
vf_coef = 0.5
max_grad_norm = 0.5
torch_threads = 1
device = "cpu"

[ppo.vecnormalize]
normalize_observations = true
normalize_rewards = false
clip_obs = 10.0

[checkpoint]
interval = 51200
initial = true

[evaluation]
interval = 102400
initial = true
final = true
deterministic_episodes = 2
stochastic_episodes = 20
random_baseline_episodes = 100
seed = 12345
workers = 0

[artifacts]
periodic_episodes = 10
retain_failed_cap = 20

[resume]
source_checkpoint = ""
allow_executable_change = false
